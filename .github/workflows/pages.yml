name: Publish NTWR Signal Wall

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'signals.json'
      - 'simulation.json'
      - 'trend-563030.html'
      - 'trend-563030.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ntwr-signal-wall-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public signal feed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("signals.json").read_text(encoding="utf-8"))
          assert data["schema_version"]==2 and data["symbol"]=="159680.SZ"
          assert data["account_mode"]=="USER_REPORTED_POSITION_SIGNAL_NOT_BROKER_CONNECTED"
          assert set(data)=={"schema_version","symbol","strategy","account_mode","privacy","entries"}
          entries=data["entries"]
          allowed={"market_date","policy","strategy_version","account_mode",
                   "signal","timeliness","close_market","stock_weight_pct",
                   "reference_target_weight_pct","suggested_change_pp",
                   "next_buy_zone","next_sell_zone","next_weekday",
                   "strategy_rung","ledger_freshness","reporting_basis",
                   "capital_basis","minimum_fee_warning","reason",
                   "run_url","source_verified"}
          forbidden={"execution_price_cny","quantity_shares","commission_cny",
                     "cost_basis","average_cost","cash_cny","notional_cny",
                     "grid_anchor","private/positions/","reported_fills"}
          # Inspect names of JSON fields rather than substrings of legal
          # categorical descriptions, such as USER_REPORTED_FILLS_... .
          def walk_keys(obj):
              if isinstance(obj,dict):
                  for key,value in obj.items():
                      yield key.lower()
                      yield from walk_keys(value)
              elif isinstance(obj,list):
                  for item in obj:
                      yield from walk_keys(item)
          exposed=set(walk_keys(data))
          assert not exposed.intersection(forbidden), "sensitive real fill field in public feed"
          seen=set()
          for e in entries:
              assert set(e)==allowed, "unapproved public schema fields"
              d=e["market_date"]
              assert d not in seen and d>="2026-11-18"
              seen.add(d)
              assert e["policy"]=="ntwr_a_v11_18"
              assert e["strategy_version"]=="NTWR-A V11.18-HS / user-reported position"
              assert e["account_mode"]==data["account_mode"]
              assert e["signal"] in ("BUY","SELL","HOLD")
              assert e["timeliness"] in ("HISTORICAL_ONLY","PENDING_NEXT_OPEN")
              assert e["next_weekday"]>d
              assert e["source_verified"] is True
              from decimal import Decimal
              for key in ("stock_weight_pct","reference_target_weight_pct","suggested_change_pp"):
                  assert Decimal(e[key]).as_tuple().exponent >= -1
              for field in ("next_buy_zone","next_sell_zone"):
                  z=e[field]
                  if z is None:
                      continue
                  assert set(z)=={"low","high","direction","precision"}
                  assert Decimal(z["high"])-Decimal(z["low"])==Decimal("0.01")
                  assert z["precision"]=="PUBLIC_APPROXIMATE_ONLY_EXACT_RULE_PRIVATE"
          assert entries==sorted(entries,key=lambda e:e["market_date"],reverse=True)
          print(f"Validated {len(entries)} privacy-safe actual-ledger signal cards.")
          PY
      - name: Validate historical simulated four-card comparison (separate from real ledger)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('simulation.json')
          assert p.exists(), 'verified historical comparison was not published'
          s=json.loads(p.read_text(encoding='utf-8'))
          assert s['schema_version']==1 and s['symbol']=='159680.SZ'
          assert s['account_mode']=='COUNTERFACTUAL_PAPER_ONLY_NOV12_INITIAL_BUY'
          assert s['simulation_start']=='2026-11-12' and s['simulation_end']=='2026-11-17'
          assert s['entry_budget_target_pct']=='2.0'
          assert s['fee_model']=='SIMULATED_3BP_EACH_SIDE_NOT_REAL_5CNY_MINIMUM'
          dates=[e['market_date'] for e in s['entries']]
          assert dates==['2026-11-17','2026-11-16','2026-11-13','2026-11-12']
          assert all(e['timeliness']=='HISTORICAL_ONLY' for e in s['entries'])
          text=json.dumps(s,ensure_ascii=False).lower()
          for word in ('reported_fills','execution_price_cny','quantity_shares',
                       'commission_cny','cost_basis','grid_anchor','private/positions/'):
              assert word not in text
          print('PASS: four privacy-safe simulated comparison cards')
          PY
      - name: Validate independent 563030 SMA200 research feed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          page = Path('trend-563030.html')
          feed_file = Path('trend-563030.json')
          assert page.is_file() and page.stat().st_size > 0, 'trend page missing'
          assert feed_file.is_file() and feed_file.stat().st_size > 0, 'trend JSON missing'
          text = page.read_text(encoding='utf-8')
          assert 'trend-563030.json' in text and 'SMA200' in text
          feed = json.loads(feed_file.read_text(encoding='utf-8'))
          assert feed['schema_version'] == 1 and feed['symbol'] == '563030.SH'
          assert isinstance(feed['entries'], list) and feed['entries'], 'trend feed empty'
          allowed = {'schema_version','symbol','strategy_id','account_mode','status',
                     'market_date','signal','signal_timeliness','close_market',
                     'sma200','sma200_deviation_pct','trend_state','stock_weight_pct',
                     'target_weight_pct','next_weekday','source_status','reason',
                     'commission_model','simulation_start'}
          for record in feed['entries']:
              assert set(record) == allowed, 'trend public field allowlist violated'
              assert record['strategy_id'] == 'trend_sma200'
              assert record['account_mode'] == 'PAPER_ZERO_HOLDINGS_FROM_2026_11_19_NOT_BROKER_CONNECTED'
              assert record['source_status'] == 'PARTIAL'
              assert record['signal'] in {'BUY','SELL','HOLD','NO_SIGNAL'}
              if record['status'] == 'BLOCKED':
                  assert record['signal'] == 'NO_SIGNAL'
          print('PASS: SMA200 563030 independent paper signal page and feed')
          PY
      - name: Assemble public-only website
        run: |
          mkdir -p public
          cp index.html signals.json simulation.json trend-563030.html trend-563030.json public/
          test -s public/trend-563030.html && test -s public/trend-563030.json
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
